<!DOCTYPE html>
<html lang="en">
<head>

    <!--
    noVNC example: lightweight example using minimal UI and features

    This is a self-contained file which doesn't import WebUtil or external CSS.

    Copyright (C) 2019 The noVNC Authors
    noVNC is licensed under the MPL 2.0 (see LICENSE.txt)
    This file is licensed under the 2-Clause BSD license (see LICENSE.txt).

    Connect parameters are provided in query string:
        http://example.com/?host=HOST&port=PORT&scale=true
    -->
    <title>noVNC</title>

    <style>

        body {
            margin: 0;
            background-color: dimgrey;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        html {
            height: 100%;
        }

        #top_bar {
            display: none;
        }
        #status {
            display: none;
        }
        #sendCtrlAltDelButton {
            display: none;
        }

        #screen {
            flex: 1; /* fill remaining space */
            overflow: hidden;
        }
        /* Full screen on a phone: the picture fills the width, top at the
           top (fitScreen). */
        body.fit-width { overflow: hidden; }
        body.fit-width #screen { flex: none; }

    </style>

    <script type="module" crossorigin="anonymous">
        // RFB holds the API to connect and communicate with a VNC server
        import RFB from './core/rfb.js';
        import KeyTable from './core/input/keysym.js';
        import keysyms from './core/input/keysymdef.js';
        import { makeScreen } from './closedhand-screen.js';

        const Screen = makeScreen(RFB, RFB.messages);
        let rfb;
        let desktopName;

        // When this function is called we have
        // successfully connected to a server
        function connectedToServer(e) {
            status("Connected to " + desktopName);
        }

        // This function is called when we are disconnected.
        // Idle proxies drop the websocket after a while even though the
        // remote desktop is still running, so always try to reconnect.
        // Tokens expire after 5 minutes, so fetch a fresh one first.
        // The last picture stays on screen until the new connection draws
        // its first frame: coming back to a phone, whose browser had dropped
        // the connection while away, showed grey for about five seconds.
        // Away, nothing is asked; back, it connects again at once.
        let retry = null, restarting = false, awaySince = 0;
        function disconnectedFromServer(e) {
            // Only the connection in use: one replaced by a newer one is done.
            if (e && e.target && e.target !== rfb) return;
            status("Reconnecting…");
            showPicture();
            if (restarting) return;
            clearTimeout(retry);
            if (!document.hidden) retry = setTimeout(reconnect, 3000);
        }
        let lastPicture = null;
        function keepPicture() {
            const c = document.querySelector('#screen canvas');
            if (!c || !c.width || !c.height) return;
            try {
                const b = c.getBoundingClientRect();
                lastPicture = { url: c.toDataURL('image/jpeg', 0.7), left: b.left + window.scrollX, top: b.top + window.scrollY, width: b.width, height: b.height };
            } catch (err) { /* nothing kept */ }
        }
        function showPicture() {
            if (!lastPicture || document.getElementById('lastPicture')) return;
            const img = new Image();
            img.id = 'lastPicture'; img.alt = ''; img.src = lastPicture.url;
            Object.assign(img.style, { position: 'absolute', left: lastPicture.left + 'px', top: lastPicture.top + 'px',
                width: lastPicture.width + 'px', height: lastPicture.height + 'px', zIndex: 10, pointerEvents: 'none' });
            document.body.appendChild(img);
        }
        function dropPicture() { const img = document.getElementById('lastPicture'); if (img) img.remove(); }

        async function reconnect() {
            try {
                const resp = await fetch('/api/sandbox/vnc-token');
                const data = await resp.json();
                if (data.token) {
                    url = urlBase + '/vnc?token=' + data.token;
                }
            } catch (err) { /* keep old url, retry below */ }
            connect();
        }

        // When this function is called, the server requires
        // credentials to authenticate
        function credentialsAreRequired(e) {
            const password = prompt("Password Required:");
            rfb.sendCredentials({ password: password });
        }

        // When this function is called we have received
        // a desktop name from the server
        function updateDesktopName(e) {
            desktopName = e.detail.name;
        }

        // Since most operating systems will catch Ctrl+Alt+Del
        // before they get a chance to be intercepted by the browser,
        // we provide a way to emulate this key sequence.
        function sendCtrlAltDel() {
            rfb.sendCtrlAltDel();
            return false;
        }

        // Show a status text in the top bar
        function status(text) {
            document.getElementById('status').textContent = text;
        }

        // This function extracts the value of one variable from the
        // query string. If the variable isn't defined in the URL
        // it returns the default value instead.
        function readQueryVariable(name, defaultValue) {
            // A URL with a query parameter can look like this:
            // https://www.example.com?myqueryparam=myvalue
            //
            // Note that we use location.href instead of location.search
            // because Firefox < 53 has a bug w.r.t location.search
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)'),
                  match = document.location.href.match(re);

            if (match) {
                // We have to decode the URL since want the cleartext value
                return decodeURIComponent(match[1]);
            }

            return defaultValue;
        }

        document.getElementById('sendCtrlAltDelButton')
            .onclick = sendCtrlAltDel;

        // Read parameters specified in the URL query string
        // By default, use the host and port of server that served this file
        const host = readQueryVariable('host', window.location.hostname);
        let port = readQueryVariable('port', window.location.port);
        const password = readQueryVariable('password');
        const path = readQueryVariable('path', 'websockify');

        // | | |         | | |
        // | | | Connect | | |
        // v v v         v v v

        // Build the websocket URL used to connect
        let urlBase = (window.location.protocol === "https:") ? 'wss' : 'ws';
        urlBase += '://' + host;
        if(port) {
            urlBase += ':' + port;
        }
        let url = urlBase + '/' + path;

        function connect() {
            status("Connecting");

            // Creating a new RFB object will start a new connection
            rfb = new Screen(document.getElementById('screen'), url,
                             { credentials: { password: password } });
            rfb.onScreenSize = tellScreenSize;
            rfb.onFrame = function () { restarting = false; dropPicture(); };
            rfb.dragScrolls = fit === 'width';
            rfb.onTap = tapped;
            rfb.onScrolled = function () { setTimeout(loadEditables, 400); };

            // Add listeners to important events from the RFB module
            rfb.addEventListener("connect",  connectedToServer);
            rfb.addEventListener("disconnect", disconnectedFromServer);
            rfb.addEventListener("credentialsrequired", credentialsAreRequired);
            rfb.addEventListener("desktopname", updateDesktopName);

            // Set parameters that can be changed on an active connection
            rfb.viewOnly = readQueryVariable('view_only', false);
            rfb.scaleViewport = readQueryVariable('scale', false);

            // Latency tuning for browser-inside-VNC workloads.
            // - qualityLevel 5 (default 6): ever-so-slightly lower JPEG quality, noticeable reduction in
            //   packet size per frame, barely visible in typical web content.
            // - compressionLevel 2 (default): keep moderate CPU cost.
            // - showDotCursor=false: skip drawing the local cursor overlay; the remote cursor is enough.
            // The screen's size is the sandbox computer's to set (agent /desktop/shape): Xvnc
            // refuses a viewer asking for its own size (entrypoint.sh), so none is asked.
            rfb.qualityLevel = 5;
            rfb.compressionLevel = 2;
            rfb.showDotCursor = false;
        }

        // Full screen on a phone the picture fills the width, its top at the
        // top, and what the phone's keyboard covers stays where it was, as a
        // page in a phone's browser does; anywhere else the whole picture
        // fits. The page around this one says which, and is told each new
        // size once a frame of it is drawn, so full screen shows the picture
        // only once it has the phone's shape.
        let fit = 'contain', screenSize = null;
        function fitScreen() {
            if (rfb) rfb.dragScrolls = fit === 'width';
            const byWidth = fit === 'width' && screenSize;
            document.body.classList.toggle('fit-width', !!byWidth);
            document.getElementById('screen').style.height = byWidth ? (window.innerWidth * screenSize.height / screenSize.width) + 'px' : '';
        }
        function tellScreenSize(width, height, drawn) {
            screenSize = { width, height };
            fitScreen();
            if (drawn && window.parent !== window) window.parent.postMessage({ type: 'closedhand-screen', width, height }, window.location.origin);
        }
        window.addEventListener('resize', fitScreen);

        connect();

        // Typing from a phone: the page around this one has the phone's
        // keyboard and sends what is typed here, from this same origin only.
        const SPECIAL = { Backspace: [KeyTable.XK_BackSpace, 'Backspace'], Enter: [KeyTable.XK_Return, 'Enter'],
                          Tab: [KeyTable.XK_Tab, 'Tab'], Escape: [KeyTable.XK_Escape, 'Escape'] };
        window.addEventListener('message', function(e) {
            if (e.origin !== window.location.origin || !e.data) return;
            if (e.data.type === 'closedhand-fit') { fit = e.data.fit === 'width' ? 'width' : 'contain'; fitScreen(); return; }
            if (e.data.type !== 'closedhand-keys' || !rfb) return;
            const key = SPECIAL[e.data.key];
            if (key) { rfb.sendKey(key[0], key[1]); return; }
            for (const ch of String(e.data.text || '').slice(0, 2000)) rfb.sendKey(keysyms.lookup(ch.codePointAt(0)), null);
        });

        document.addEventListener('visibilitychange', function() {
          try { rfb.focusOnClick = !document.hidden; } catch (e) {}
          if (document.hidden) { keepPicture(); awaySince = Date.now(); return; }
          // Back after more than a moment: a phone's browser has usually
          // dropped the connection without saying so yet, so a new one
          // starts now, over the last picture.
          if (!rfb) return;
          if (rfb._rfbConnectionState === 'disconnected' || Date.now() - awaySince > 5000) {
            clearTimeout(retry);
            restarting = true;
            showPicture();
            try { if (rfb._rfbConnectionState !== 'disconnected') rfb.disconnect(); } catch (e) {}
            reconnect();
          }
          loadEditables();
        });

        // A text box tapped opens the phone's keyboard, and anything else
        // tapped closes it (the page around this one, monTypeHere). Where
        // the page in front can be typed into comes from the sandbox
        // computer (agent /desktop/editables), asked now and then while full
        // screen on a phone, and again after a tap or a scroll.
        let editables = [];
        function loadEditables() {
            if (fit !== 'width' || document.hidden) return;
            fetch('/api/sandbox/editables', { cache: 'no-store' }).then((r) => r.json())
                .then((d) => { editables = Array.isArray(d.rects) ? d.rects : []; }).catch(() => {});
        }
        setInterval(loadEditables, 1500);
        function tapped(x, y) {
            if (fit !== 'width') return;
            const onBox = editables.some((r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
            try { if (window.parent !== window && window.parent.monTypeHere) window.parent.monTypeHere(onBox); } catch (e) {}
            setTimeout(loadEditables, 700);
        }
    </script>
</head>

<body>
    <div id="top_bar">
        <div id="status">Loading</div>
        <div id="sendCtrlAltDelButton">Send CtrlAltDel</div>
    </div>
    <div id="screen">
        <!-- This is where the remote screen will appear -->
    </div>
</body>
</html>
